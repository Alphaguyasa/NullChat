name: Android CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch makes an in-flight run pointless.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Lint, unit tests, debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # No SDK setup step: ubuntu-latest ships an Android SDK with licenses
      # accepted (ANDROID_HOME), and AGP downloads any missing platform itself.

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Lint
        run: ./gradlew :app:lintDebug --stacktrace

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      # Unsigned: there is no keystore in the repo (NEEDS_APPROVAL #4). Building it
      # catches R8 failures (missing classes, broken keep rules) before anyone
      # needs a release, and the step summary tracks APK size over time.
      - name: Build release APK (R8, unsigned)
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Report APK sizes
        run: |
          {
            echo "### APK size"
            echo "| APK | Bytes | MiB |"
            echo "|---|---:|---:|"
            for f in app/build/outputs/apk/debug/*.apk app/build/outputs/apk/release/*.apk; do
              b=$(stat -c %s "$f")
              echo "| $(basename "$f") | $b | $(awk "BEGIN { printf \"%.2f\", $b / 1048576 }") |"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      # KSP rewrites app/schemas when the schema it generates differs from the
      # committed one. A diff here means an entity changed without its exported
      # schema being committed; the diff is printed so the generated file can be
      # copied from the log. Room ignores identityHash when comparing, so a
      # wrong hash alone is caught by NChatDatabaseMigrationTest instead.
      - name: Check Room schemas are committed
        run: |
          git add --intent-to-add app/schemas
          if ! git diff --exit-code -- app/schemas; then
            echo "::error::app/schemas differs from the schema Room generated; commit the generated file."
            exit 1
          fi

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: nchat-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30

      # Needed to de-obfuscate a crash trace from an R8 build.
      - name: Upload R8 mapping
        uses: actions/upload-artifact@v4
        with:
          name: nchat-release-mapping
          path: app/build/outputs/mapping/release/
          retention-days: 30

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            app/build/reports/
            app/build/test-results/
          retention-days: 14

  instrumented:
    # Room DAO/migration, Keystore crypto and Compose UI tests need a real
    # Android runtime. Radios still need two phones; nothing here touches Nearby.
    name: Instrumented tests (emulator)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Hardware acceleration: without KVM the x86_64 emulator is too slow to boot
      # inside the job timeout.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Build the APKs before the emulator starts so its boot clock is not spent
      # compiling.
      - name: Build test APKs
        run: ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest --stacktrace

      - name: Run instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: default
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: ./gradlew :app:connectedDebugAndroidTest --stacktrace

      - name: Upload instrumented reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instrumented-reports
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
          retention-days: 14
