name: Release tag

# Tags every merge to main as v<YYYY-MM-DD>-<n> (Africa/Nairobi date, n counting
# up within the day) so any merge can be rolled back to. Done here rather than by
# the daily cloud run because that session's git proxy refuses tag pushes.
#
# Merges only land after the Android CI checks pass (MERGE POLICY), so this does
# not wait for them again.

on:
  push:
    branches: [main]
  workflow_dispatch:

# Two merges in quick succession must not both claim the same n.
concurrency:
  group: release-tag
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  tag:
    name: Tag merges to main
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Tags every untagged first-parent commit of the pushed commit's day, not
      # just the pushed commit. A run that failed or never happened (or merges
      # from before this workflow existed) is caught up by the next one, and the
      # numbering stays in merge order.
      - name: Tag untagged merges of the day
        run: |
          set -euo pipefail
          git fetch --tags --force
          day=$(TZ=Africa/Nairobi git log -1 --format=%cd --date=format-local:%Y-%m-%d "$GITHUB_SHA")
          last=$(git tag -l "v$day-*" | sed "s/^v$day-//" | grep -E '^[0-9]+$' | sort -n | tail -1 || true)
          n=${last:-0}
          new=()
          for c in $(git rev-list --first-parent --reverse --since="$day 00:00:00 +0300" "$GITHUB_SHA"); do
            c_day=$(TZ=Africa/Nairobi git log -1 --format=%cd --date=format-local:%Y-%m-%d "$c")
            [ "$c_day" = "$day" ] || continue
            if git tag --points-at "$c" | grep -q '^v'; then continue; fi
            n=$((n + 1))
            git tag "v$day-$n" "$c"
            echo "v$day-$n -> $(git log -1 --format='%h %s' "$c")"
            new+=("v$day-$n")
          done
          if [ ${#new[@]} -gt 0 ]; then
            git push origin "${new[@]}"
          else
            echo "nothing to tag"
          fi
